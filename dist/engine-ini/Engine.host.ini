; Hearth host Engine.ini — REFERENCE SHAPE ONLY. NOT the authoritative mechanism.
;
; AUTHORITATIVE transport swap for Bellwright is the runtime Lua mod (bw_host):
; the spike proved Engine.ini NetDriver config is IGNORED on this build, so the
; mod rewrites NetDriverDefinitions[GameNetDriver] -> IpNetDriver live. This file
; documents the intended shape and the no-Steam stance only.
;
; Bellwright hosts with Steam fully closed (spike 2026-06-14): SteamAPI fails to
; init and the engine falls to OnlineSubsystemNull on its own. There is NO Steam
; client per instance. The keystone below disables the Steam OSS so nothing tries
; to hydrate a platform session.
;
; PORT: <GAMEPLAY_PORT> is a PLACEHOLDER token. The live per-instance value is
; written by host-instance.ps1 at launch. Never bind the literal placeholder;
; never assume 7777. Unreal rewrites the user-dir Engine.ini on clean exit, so
; the launcher re-emits it every launch.
;
; The OSS/auth/save-key values were confirmed by the real-map host + retail-join
; gate run.

[/Script/EngineSettings.GameMapsSettings]
LocalMapOptions=?listen

[URL]
Port=<GAMEPLAY_PORT>

[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

[OnlineSubsystem]
DefaultPlatformService=Null

[OnlineSubsystemSteam]
bEnabled=false

[/Script/OnlineSubsystemUtils.IpNetDriver]
NetConnectionClassName="/Script/OnlineSubsystemUtils.IpConnection"
; Heavy-world joins need a long handshake window (Beacon/Lantern lesson).
ConnectionTimeout=300.0
