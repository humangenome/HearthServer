; Hearth client Engine.ini template — Bellwright direct-IP join. REFERENCE SHAPE.
;
; AUTHORITATIVE swap is the HearthConnect Lua mod (config is ignored on this
; build). The client only needs the transport swap so its "open <ip>:<port>"
; travels over stock IpNetDriver to the host. It does NOT host (no LocalMapOptions
; / [URL] Port). The launcher writes this into the player's Bellwright user-dir
; Engine.ini before launch and re-applies it every launch (Unreal rewrites on exit).

[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

[OnlineSubsystem]
DefaultPlatformService=Null

[OnlineSubsystemSteam]
bEnabled=false

[/Script/OnlineSubsystemUtils.IpNetDriver]
NetConnectionClassName="/Script/OnlineSubsystemUtils.IpConnection"
InitialConnectTimeout=600.0
ConnectionTimeout=600.0
MaxClientRate=2097152
MaxInternetClientRate=2097152
ClientDesiredSocketReceiveBufferBytes=2097152
ClientDesiredSocketSendBufferBytes=2097152

[/Script/Engine.Player]
ConfiguredInternetSpeed=2097152
ConfiguredLanSpeed=2097152

[/Script/Engine.GameNetworkManager]
TotalNetBandwidth=16777216
MaxDynamicBandwidth=2097152
MinDynamicBandwidth=524288

[ConsoleVariables]
net.UseAdaptiveNetUpdateFrequency=1
net.TrackQueuedActorThreshold=1
net.TrackQueuedActorThresholdOwner=1
