name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  # The host-side UE4SS core is vendored at vendor/ue4ss/server/UE4SS.dll and
  # SHA-verified here instead of being pulled from UE4SS-RE's floating
  # experimental-latest tag. To move the pin: replace the vendored DLL, update
  # this hash, and validate start, join, disconnect, reconnect and forced GC on
  # a real host first.
  UE4SS_SERVER_SHA256: 2ad348bf2025bd26b2aa63b478d9813afbd4e656c9bcfb3fdf6752c4d285f298

jobs:
  # Cheap Linux gate that runs before the Windows build. Both failures it
  # catches are permanent once a release publishes: a tag whose binaries report
  # a different version from /api/v1/info (v0.1.82 shipped 0.1.81, v0.1.65
  # shipped 0.1.64), and a release body that does not meet the standard.
  guard:
    name: Guard release preconditions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches the version stamp
        run: bash scripts/check-version-stamp.sh "${{ github.ref_name }}"

      - name: Build the release body from the changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          # Fail rather than publish the old "See CHANGELOG.md for details."
          # placeholder. check-version-stamp.sh already requires the section;
          # this is the belt-and-braces read.
          notes="$(awk -v v="## [$version]" '
            index($0, v) == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)"
          notes="$(printf '%s\n' "$notes" | sed -e '/./,$!d')"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          fi
          url="https://www.survivalservers.com/services/game_servers/bellwright/?utm_source=github&utm_medium=release&utm_campaign=hearthserver"
          {
            printf '%s\n' "$notes"
            printf '\n## Downloads\n\n'
            printf '%s\n' "- \`HearthServer-Host-Windows-x64-$tag.zip\` — the complete host package: the supervisor, the UE4SS runtime with the \`bw_host\` and \`bw_fog\` mods and their signature packs, the Engine.ini templates and \`host-instance.ps1\`. Extract it, point the script at a Bellwright install, and you have a joinable server. See the repository README."
            printf '%s\n' "- \`HearthServer-Supervisor-Windows-x64-$tag.zip\` — the supervisor only: \`HearthServer.exe\`, its .NET runtime, and \`HearthSaveGuard.exe\`. For people who already have the host runtime and only want the RCON / query / admin-API sidecar."
            printf '\n---\n\n'
            printf 'Hosting: [SurvivalServers.com](%s) runs Hearth for you.\n' "$url"
          } > release-body.md
          cat release-body.md

      - name: Lint the release body
        run: bash scripts/lint-release-notes.sh --profile body release-body.md

      - name: Upload the release body
        uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: release-body.md
          retention-days: 7

  build:
    name: Build HearthServer (windows-latest)
    runs-on: windows-latest
    needs: guard
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore NuGet
        run: dotnet restore HearthServer.sln

      - name: Build
        run: dotnet build HearthServer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HearthServer.sln --configuration Release --no-build --verbosity normal

      - name: Build and test Bellwright save guard
        run: |
          cargo test --manifest-path src/tools/Hearth.SaveGuard/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw "save guard tests failed" }
          cargo build --manifest-path src/tools/Hearth.SaveGuard/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw "save guard build failed" }

      - name: Publish HearthServer (self-contained)
        run: dotnet publish src/server/HearthServer/HearthServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false

      - name: Verify the published binary reports the tag version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $publish = "src/server/HearthServer/bin/Release/net8.0/win-x64/publish"
          $exe = [Diagnostics.FileVersionInfo]::GetVersionInfo("$publish/HearthServer.exe")
          if ($exe.FileVersion -ne "$version.0" -or -not $exe.ProductVersion.StartsWith($version)) {
            throw "tag $version does not match HearthServer.exe FileVersion=$($exe.FileVersion), ProductVersion=$($exe.ProductVersion)"
          }

      - name: Stage release artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $publish = "src/server/HearthServer/bin/Release/net8.0/win-x64/publish"
          if (-not (Test-Path "$publish/HearthServer.exe")) { throw "server publish missing at $publish" }
          $saveGuard = "src/tools/Hearth.SaveGuard/target/release/HearthSaveGuard.exe"
          if (-not (Test-Path $saveGuard)) { throw "Bellwright save guard missing at $saveGuard" }
          Copy-Item $saveGuard "$publish/HearthSaveGuard.exe" -Force
          # Named for what it is: the supervisor only. The complete host
          # package is built below under its own name.
          Compress-Archive -Path "$publish/*" -DestinationPath "artifacts/HearthServer-Supervisor-Windows-x64-$tag.zip"

          # For 73 published releases this archive went out under the complete
          # host package's asset name, so anyone following the download
          # instructions got a supervisor and a server nobody could join. A
          # checksum cannot catch that -- every one of those zips was internally
          # consistent and correctly checksummed, just the wrong thing under the
          # wrong name. Assert the name and the layout.
          python scripts/verify-supervisor-archive.py "artifacts/HearthServer-Supervisor-Windows-x64-$tag.zip"
          if ($LASTEXITCODE -ne 0) { throw "supervisor archive failed verification - refusing to publish" }

          # ----- Complete host package -----
          # The artifact that runs a joinable server. Same layout the managed
          # fleet pins; scripts/verify-server-bundle.py asserts it below.
          $ue4ss = "vendor/ue4ss/server/UE4SS.dll"
          if (-not (Test-Path $ue4ss)) { throw "vendored server UE4SS.dll missing at $ue4ss" }
          $sha = (Get-FileHash $ue4ss -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "${{ env.UE4SS_SERVER_SHA256 }}") { throw "server UE4SS.dll sha256 mismatch: got $sha, pinned ${{ env.UE4SS_SERVER_SHA256 }}" }
          Write-Host "UE4SS server core pinned + verified: sha256=$sha"

          New-Item -ItemType Directory -Force -Path stage/HearthServer, stage/ue4ss, stage/engine-ini, stage/redist | Out-Null
          Copy-Item -Recurse -Force "$publish/*" stage/HearthServer/
          Copy-Item $ue4ss stage/ue4ss/UE4SS.dll
          foreach ($required in @("dist/ue4ss-server/UE4SS-settings.ini", "dist/ue4ss-server/Mods", "dist/ue4ss-server/UE4SS_Signatures", "dist/engine-ini", "dist/redist", "dist/steam_appid.txt", "scripts/host-instance.ps1")) {
            if (-not (Test-Path $required)) { throw "$required missing - refusing to build a host package short its runtime" }
          }
          Copy-Item dist/ue4ss-server/UE4SS-settings.ini stage/ue4ss/
          Copy-Item -Recurse -Force dist/ue4ss-server/Mods stage/ue4ss/
          # UE4SS treats mixed LF/CRLF mods.txt inconsistently: rewrite it as
          # fully CRLF-terminated ASCII so the load list is exactly as declared.
          $serverMods = "stage/ue4ss/Mods/mods.txt"
          $lines = @(Get-Content $serverMods | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($lines.Count -eq 0) { throw "stage/ue4ss/Mods/mods.txt enables nothing" }
          [System.IO.File]::WriteAllBytes($serverMods, [System.Text.ASCIIEncoding]::ASCII.GetBytes(($lines -join "`r`n") + "`r`n"))
          # The 5 PDB-derived AOB signatures are mandatory on UE5.7: without them
          # UE4SS falls back to its built-in scanner and hangs at "Waiting for
          # object construction".
          Copy-Item -Recurse -Force dist/ue4ss-server/UE4SS_Signatures stage/ue4ss/
          Copy-Item -Recurse -Force dist/engine-ini/* stage/engine-ini/
          Copy-Item -Recurse -Force dist/redist/* stage/redist/
          Copy-Item dist/steam_appid.txt stage/
          Copy-Item scripts/host-instance.ps1 stage/
          Compress-Archive -Path stage/* -DestinationPath "artifacts/HearthServer-Host-Windows-x64-$tag.zip"
          python scripts/verify-server-bundle.py "artifacts/HearthServer-Host-Windows-x64-$tag.zip"
          if ($LASTEXITCODE -ne 0) { throw "host package failed verification - refusing to publish" }

          Get-FileHash artifacts/*.zip -Algorithm SHA256 | ForEach-Object {
            "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf)
          } | Out-File -FilePath artifacts/checksums.txt -Encoding ascii

      - name: Download the release body
        uses: actions/download-artifact@v4
        with:
          name: release-body

      - name: Create GitHub release (HearthServer)
        uses: softprops/action-gh-release@v2
        with:
          name: HearthServer ${{ github.ref_name }}
          files: |
            artifacts/*.zip
            artifacts/checksums.txt
          body_path: release-body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Author as HumanGenome rather than github-actions[bot] when the PAT
          # is available; falls back to the default token otherwise.
          token: ${{ secrets.HUMANGENOME_PAT || secrets.GITHUB_TOKEN }}
